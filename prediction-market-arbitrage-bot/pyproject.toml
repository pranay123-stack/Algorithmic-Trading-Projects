[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "prediction-arb"
version = "0.1.0"
description = "AI-powered prediction market arbitrage bot (Kalshi x Polymarket)"
requires-python = ">=3.11"
dependencies = [
    "aiohttp>=3.9.0",
    "websockets>=12.0",
    "sentence-transformers>=3.0.0",
    "numpy>=1.26.0",
    "httpx>=0.27.0",
    "python-dotenv>=1.0.0",
    "pydantic>=2.5.0",
    "discord-webhook>=1.3.0",
    "rich>=13.7.0",
]

[project.scripts]
arb-bot = "prediction_arb.main:cli"
